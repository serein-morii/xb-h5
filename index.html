<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="专为手机端设计的喜八订单管理工作台。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="喜八工作台" />
    <meta property="og:description" content="专为手机端设计的喜八订单管理工作台。" />
    <meta property="og:image" content="https://m.gooop.top/og-order.png" />
    <meta property="og:image:width" content="478" />
    <meta property="og:image:height" content="478" />
    <meta property="og:url" content="https://m.gooop.top/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://m.gooop.top/og-order.png" />
    <link rel="icon" href="/favicon.svg" />
    <title>喜八移动订单管理</title>
    <script type="application/json" id="app-startup-config">
      {
        "order": { "eyebrow": "ORDER WORKSPACE", "title": "喜八工作台", "message": "正在启动订单系统", "status": "安全连接已就绪", "mark": "XB", "accent": "#2867ee", "minimumMs": 700 },
        "otp": { "eyebrow": "PRIVATE VAULT", "title": "OTP Vault", "message": "正在打开身份保险库", "status": "安全通道已就绪", "mark": "KEY", "accent": "#6674cf", "minimumMs": 0 },
        "lab": { "eyebrow": "HANDY LAB", "title": "实验室", "message": "正在准备工具", "status": "运行环境已就绪", "mark": "LAB", "accent": "#c87545", "minimumMs": 300 }
      }
    </script>
    <script>
      (function () {
        var host = location.hostname.toLowerCase();
        var path = location.pathname.replace(/\/+$/, "") || "/";
        function hostIs(name) { return host === name + ".gooop.top" || host.indexOf(name + ".") === 0; }
        var otp = hostIs("otp") || path === "/otp" || path.indexOf("/otp/") === 0 || path.indexOf("/s/") === 0 || path.indexOf("/t/") === 0;
        var lab = hostIs("lab") || path === "/lab" || path.indexOf("/lab/") === 0 || path === "/bead-studio" || path === "/utilities" || path.indexOf("/handy/") === 0;
        var volunteer = hostIs("volunteer") || path === "/volunteer" || path.indexOf("/volunteer/") === 0;
        var peach = hostIs("peach") || path === "/peach" || path.indexOf("/customer/") === 0;
        var system = otp ? "otp" : lab ? "lab" : "order";
        var ogSurface = otp ? "otp" : lab ? "lab" : volunteer ? "volunteer" : peach ? "peach" : "order";
        if (hostIs("otp") && path.indexOf("/s/") !== 0 && path.indexOf("/t/") !== 0 && path !== "/otp" && path.indexOf("/otp/") !== 0) path = path === "/" ? "/otp" : "/otp" + path;
        else if (hostIs("lab") && path !== "/lab" && path.indexOf("/lab/") !== 0 && path !== "/bead-studio" && path !== "/utilities" && path.indexOf("/handy/") !== 0) path = path === "/" ? "/lab" : "/lab" + path;
        else if (hostIs("volunteer") && path !== "/volunteer" && path.indexOf("/volunteer/") !== 0) path = path === "/" ? "/volunteer" : "/volunteer" + path;
        else if (hostIs("peach") && path !== "/peach" && path.indexOf("/peach/") !== 0 && path.indexOf("/customer/") !== 0) path = path === "/" ? "/peach" : "/peach" + path;
        var savedTheme;
        var savedPalette;
        try { savedTheme = localStorage.getItem("xb-h5-theme"); } catch (_) { /* 使用系统主题。 */ }
        try { savedPalette = localStorage.getItem("xb-h5-theme-palette"); } catch (_) { /* 使用默认海蓝。 */ }
        var dark = savedTheme === "dark" || (savedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.startupSystem = system;
        document.documentElement.dataset.palette = savedPalette === "emerald" || savedPalette === "amber" || savedPalette === "berry" ? savedPalette : "ocean";
        document.documentElement.classList.add(dark ? "theme-dark" : "theme-light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        if (otp) document.documentElement.dataset.otp = "1";
        try {
          var config = JSON.parse(document.getElementById("app-startup-config").textContent)[system];
          document.title = config.title;
          document.documentElement.style.setProperty("--startup-accent", config.accent);
          var origin = location.origin;
          var cards = {
            order: { title: "喜八工作台", description: "订单查询、确认支付与移动管理工作台。", image: origin + "/og-order.png" },
            otp: { title: "OTP Vault", description: "私人身份保险库，限时分享凭据与文本。", image: origin + "/og-otp.png" },
            lab: { title: "Handy Lab", description: "视频提取、拼豆图纸等实用工具。", image: origin + "/og-lab.png" },
            volunteer: { title: "鱼片志愿", description: "会员登记、志愿活动与服务记录。", image: origin + "/og-volunteer.png" },
            peach: { title: "炎陵黄桃", description: "高山鲜果，当季采摘，登录后即可下单查物流。", image: origin + "/og-peach.png" }
          };
          var card = cards[ogSurface] || cards.order;
          if (ogSurface === "otp") {
            if (path.indexOf("/t/") === 0) { card.title = "临时文本分享｜OTP Vault"; card.description = "安全查看限时分享的普通文本、Markdown、代码或 HTML。"; }
            else if (path.indexOf("/s/") === 0) { card.title = "临时凭据授权｜OTP Vault"; card.description = "通过访问码查看限时授权凭据。"; }
            else if (path.indexOf("/otp/guide") === 0) { card.title = "使用指南｜OTP Vault"; card.description = "了解 OTP Vault 的添加、使用、分享、安全保护与备份恢复。"; }
            else if (path.indexOf("/otp/changelog") === 0) { card.title = "更新日志｜OTP Vault"; card.description = "查看 OTP Vault 最近功能更新。"; }
          } else if (ogSurface === "lab") {
            if (path.indexOf("/lab/video-extract") === 0) { card.title = "短视频提取｜Handy Lab"; card.description = "解析抖音、小红书、哔哩哔哩分享链接，预览并下载媒体。"; }
            else if (path === "/bead-studio" || path.indexOf("/lab/bead") === 0 || path.indexOf("/handy/bead") === 0) { card.title = "拼豆工作台｜Handy Lab"; card.description = "把图片转成可编辑的拼豆图纸。"; }
          } else if (ogSurface === "volunteer") {
            if (path.indexOf("/volunteer/join") === 0) { card.title = "加入鱼片志愿"; card.description = "填写会员信息并提交鱼片志愿登记申请。"; }
            else if (path.indexOf("/volunteer/manage") === 0) { card.title = "鱼片志愿管理后台"; card.description = "鱼片志愿登记审核与会员档案管理。"; }
          } else if (ogSurface === "peach") {
            if (path.indexOf("/customer/login") === 0) { card.title = "客户登录｜炎陵黄桃"; card.description = "登录炎陵黄桃客户中心。"; }
            else if (path.indexOf("/customer/register") === 0) { card.title = "客户注册｜炎陵黄桃"; card.description = "注册炎陵黄桃客户账号。"; }
            else if (path.indexOf("/customer/reset") === 0) { card.title = "找回密码｜炎陵黄桃"; card.description = "通过邮箱验证码找回客户账号密码。"; }
          } else if (ogSurface === "order") {
            if (/^\/tools\/order\/[2-9a-hj-km-np-z]{6}/.test(path) || path.indexOf("/tools/place-order") === 0) { card.title = "专属下单｜喜八"; card.description = "通过专属短链接下单并查询历史订单。"; }
            else if (path.indexOf("/tools/store-query") === 0) { card.title = "专属查询｜喜八"; card.description = "选择店铺后只查询该店铺的订单，避免串单。"; }
            else if (path.indexOf("/tools/order") === 0 && path.indexOf("/tools/order-") !== 0) { card.title = "确认订单｜喜八"; card.description = "核对订单后即可免登录在线支付。"; }
            else if (path === "/order" || path.indexOf("/order/") === 0) { card.title = "订单查询｜喜八"; card.description = "查询喜八订单状态与物流进度。"; }
            else if (path.indexOf("/tools/order-search") === 0) { card.title = "订单查询｜喜八"; card.description = "通过手机号和验证码查询订单。"; }
          }
          function setMeta(selector, attr, value) {
            var node = document.querySelector(selector);
            if (!node) {
              node = document.createElement("meta");
              if (selector.indexOf("property=") >= 0) node.setAttribute("property", selector.replace(/.*property="([^"]+)".*/, "$1"));
              else node.setAttribute("name", selector.replace(/.*name="([^"]+)".*/, "$1"));
              document.head.appendChild(node);
            }
            node.setAttribute(attr, value);
          }
          document.title = card.title;
          setMeta('meta[name="description"]', "content", card.description);
          setMeta('meta[property="og:title"]', "content", card.title);
          setMeta('meta[property="og:description"]', "content", card.description);
          setMeta('meta[property="og:image"]', "content", card.image);
          setMeta('meta[property="og:image:width"]', "content", "478");
          setMeta('meta[property="og:image:height"]', "content", "478");
          setMeta('meta[property="og:url"]', "content", origin + location.pathname + location.search);
          setMeta('meta[property="og:type"]', "content", "website");
          setMeta('meta[name="twitter:card"]', "content", "summary");
          setMeta('meta[name="twitter:image"]', "content", card.image);
        } catch (_) { /* 页面仍可使用下方默认样式。 */ }
      })();
    </script>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      .app-starting, .app-startup {
        min-height: 100dvh; box-sizing: border-box; padding: 24px; display: grid; place-items: center;
        overflow: hidden; background: #f3f5fb; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--startup-accent, #2867ee) 18%, transparent), transparent 26%), linear-gradient(155deg, #f8f9fd, #eef0f8);
        color: #172033; font-family: Inter, "PingFang SC", system-ui, sans-serif;
      }
      #app-startup { position: fixed; inset: 0; z-index: 40; }
      #app-startup[hidden] { display: none; }
      .app-startup-copy { animation: app-startup-copy .28s ease; }
      .app-startup-card { position: relative; width: min(290px, 100%); display: grid; justify-items: center; text-align: center; animation: app-startup-arrive .48s cubic-bezier(.2,.75,.25,1) both; }
      .app-startup-card.is-settled { animation: none; }
      .app-startup-mark { position: relative; width: 68px; height: 68px; margin-bottom: 17px; display: grid; place-items: center; border: 1px solid color-mix(in srgb, var(--startup-accent) 18%, transparent); border-radius: 22px; background: color-mix(in srgb, var(--startup-accent) 13%, #fff); color: var(--startup-accent); box-shadow: 0 18px 45px color-mix(in srgb, var(--startup-accent) 20%, transparent); }
      .app-startup-mark::before, .app-startup-mark::after { content: ""; position: absolute; inset: -10px; z-index: -1; border: 1px solid color-mix(in srgb, var(--startup-accent) 18%, transparent); border-radius: 28px; animation: app-startup-pulse 1.8s ease-out infinite; }
      .app-startup-mark::after { inset: -20px; border-radius: 34px; animation-delay: .55s; }
      .app-startup-mark svg { display: none; }
      html[data-startup-system="otp"] .app-startup-mark svg { display: block; }
      html[data-startup-system="otp"] .app-startup-mark b { display: none; }
      .app-startup-mark b { font-size: 18px; letter-spacing: -.04em; }
      .app-startup-card > small { color: var(--startup-accent); font-size: 8px; font-weight: 800; letter-spacing: .17em; }
      .app-startup-card > strong { margin-top: 5px; font-size: 25px; letter-spacing: -.035em; }
      .app-startup-card > p { margin: 10px 0 0; color: #737c90; font-size: 10px; }
      .app-startup-card > em { margin-top: 16px; display: inline-flex; align-items: center; gap: 5px; color: #8a92a4; font-size: 8px; font-style: normal; }
      .app-startup-progress { width: 116px; height: 3px; margin-top: 18px; overflow: hidden; border-radius: 999px; background: color-mix(in srgb, var(--startup-accent) 13%, transparent); }
      .app-startup-progress i { width: 42%; height: 100%; display: block; border-radius: inherit; background: var(--startup-accent); animation: app-startup-progress 1.25s ease-in-out infinite; }
      @keyframes app-startup-arrive { from { opacity: 0; transform: translateY(9px) scale(.975); } to { opacity: 1; transform: none; } }
      @keyframes app-startup-copy { from { opacity: 0; } to { opacity: 1; } }
      @keyframes app-startup-pulse { 0% { opacity: 0; transform: scale(.85); } 35% { opacity: .65; } 100% { opacity: 0; transform: scale(1.12); } }
      @keyframes app-startup-progress { from { transform: translateX(-120%); } to { transform: translateX(340%); } }
      html.theme-dark .app-starting, html.theme-dark .app-startup { background: #0e1420; background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--startup-accent) 19%, transparent), transparent 26%), #0e1420; color: #eef1f8; }
      html.theme-dark .app-startup-mark { background: color-mix(in srgb, var(--startup-accent) 16%, #20283b); box-shadow: 0 18px 45px rgba(0,0,0,.3); }
      html.theme-dark .app-startup-card > p, html.theme-dark .app-startup-card > em { color: #939caf; }
      @media (prefers-reduced-motion: reduce) {
        .app-startup-card, .app-startup-copy, .app-startup-mark::before, .app-startup-mark::after, .app-startup-progress i { animation: none; }
        .app-startup-progress i { width: 100%; opacity: .55; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <main id="app-startup" class="app-starting" role="status" aria-live="polite">
      <section class="app-startup-card">
        <span class="app-startup-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15.5" cy="7.5" r="3.5"></circle><path d="m13 10-9.3 9.3a1 1 0 0 0 0 1.4l.6.6a1 1 0 0 0 1.4 0L7 20l1.5 1.5 2-2L9 18l2-2 1.5 1.5 2.5-2.5a6 6 0 0 0 4.5-1.5"></path></svg>
          <b data-startup-mark>XB</b>
        </span>
        <small data-startup-eyebrow>ORDER WORKSPACE</small>
        <strong data-startup-title>喜八工作台</strong>
        <div class="app-startup-progress" aria-hidden="true"><i></i></div>
        <p data-startup-message>正在启动订单系统</p>
        <em><span aria-hidden="true">●</span><span data-startup-status>安全连接已就绪</span></em>
      </section>
    </main>
    <script>
      (function () {
        try {
          var config = JSON.parse(document.getElementById("app-startup-config").textContent)[document.documentElement.dataset.startupSystem];
          ["eyebrow", "title", "message", "status", "mark"].forEach(function (key) {
            var node = document.querySelector("[data-startup-" + key + "]");
            if (node) node.textContent = config[key];
          });
          var card = document.querySelector(".app-startup-card");
          if (card) {
            var settle = function () { card.classList.add("is-settled"); };
            card.addEventListener("animationend", settle, { once: true });
            setTimeout(settle, 520);
          }
        } catch (_) { /* 默认启动文案已经可见。 */ }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
